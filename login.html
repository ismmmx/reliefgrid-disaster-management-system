<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReliefGrid - System Login</title>
    <!-- External CSS connection -->
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <header class="navbar" id="login-navbar">
        <div class="logo-container">
            <h1 class="logo-title">ReliefGrid</h1>
            <span class="logo-sub">Disaster Management</span>
        </div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="login.html" class="active">Login</a>
            <a href="index.html#register-section" class="btn-nav">Register</a>
        </nav>
    </header>

    <main class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <h2>User Account Login</h2>
                <p>Select your assigned role and enter credentials to access dashboard</p>
            </div>

            <!-- Function activation using onsubmit and onreset -->
            <form name="loginForm" id="loginForm" action="javascript:void(0);" method="post"
                  onsubmit="return validateLogin()" onreset="clearLoginErrors()" class="login-form" novalidate>

                <div class="form-group">
                    <label for="email">User Email Address</label>
                    <input type="email" id="email" name="email" placeholder="name@domain.com">
                    <span id="emailError" class="error-msg"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password">
                    <span id="passwordError" class="error-msg"></span>
                </div>

                <div class="form-group">
                    <label for="role">System Access Role</label>
                    <select id="role" name="role">
                        <option value="">-- Select Your System Role --</option>
                        <option value="admin">System Admin</option>
                        <option value="shelter">Shelter & Volunteer Manager</option>
                        <option value="inventory">Relief Inventory Handler</option>
                        <option value="emergency">Emergency Requester / Victim</option>
                    </select>
                    <span id="roleError" class="error-msg"></span>
                </div>

                <div class="form-options">
                    <label class="checkbox-container" for="remember">
                        <input type="checkbox" id="remember" name="remember" value="yes">
                        <span>Remember Login Session</span>
                    </label>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Login to Account</button>
                    <button type="reset" class="btn btn-outline">Clear</button>
                </div>

                <p id="loginSuccess" class="success-msg"></p>
            </form>

            <div class="login-footer">
                <p>Don't have an account yet?</p>
                <a href="index.html#register-section" class="register-link">Register New Department Account</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>© 2026 ReliefGrid Disaster Management System | Group 4 (CSC 3215)</p>
    </footer>

    <!-- External JavaScript connection -->
    <script src="login.js"></script>
</body>

</html>
