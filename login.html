<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReliefGrid - System Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- Header Navigation Bar -->
    <header class="navbar">
        <div class="logo-container">
            <h1 class="logo-title">ReliefGrid</h1>
            <span class="logo-sub">Disaster Management</span>
        </div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="login.html" class="active">Login</a>
            <a href="index.html#register-section" class="btn-nav">Register</a>
        </nav>
    </header>

    <!-- Main Container -->
    <main class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <h2>User Account Login</h2>
                <p>Select your assigned role and enter credentials to access dashboard</p>
            </div>

            <form action="#" method="POST" class="login-form">
                <div class="form-group">
                    <label for="email">User Email Address</label>
                    <input type="email" id="email" name="email" placeholder="name@domain.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                </div>

                <div class="form-group">
                    <label for="role">System Access Role</label>
                    <select id="role" name="role" required>
                        <option value="" disabled selected>-- Select Your System Role --</option>
                        <option value="admin">System Admin</option>
                        <option value="shelter">Shelter & Volunteer Manager</option>
                        <option value="inventory">Relief Inventory Handler</option>
                        <option value="emergency">Emergency Requester / Victim</option>
                    </select>
                </div>

                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" id="remember" name="remember" value="yes">
                        <span>Remember Login Session</span>
                    </label>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Login to Account</button>
                    <button type="reset" class="btn btn-outline">Clear</button>
                </div>
            </form>

            <div class="login-footer">
                <p>Don't have an account yet?</p>
                <a href="index.html#register-section" class="register-link">Register New Department Account</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 ReliefGrid Disaster Management System | Group 4 (CSC 3215)</p>
    </footer>

</body>

</html>
