
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shelter Registration - ReliefGrid</title>

    <link rel="stylesheet" href="shelter_registration.css">
</head>
<body>

    <table border="1" width="100%" cellpadding="10">
        <tr>
            <td align="center">
                <h1>ReliefGrid</h1>
                <h3>Shelter Provider Account Registration</h3>
            </td>
        </tr>
    </table>

    <br>

    <table border="1" width="100%" cellpadding="8">
        <tr>
            <td align="center">
                <a href="../../index.html"><button type="button">Go to Home Page</button></a> |
                <a href="../../login.html"><button type="button">Go to Login Page</button></a>
            </td>
        </tr>
    </table>

    <br>

    <form action="login.html" method="POST" enctype="multipart/form-data">

        <fieldset>
            <legend><b>1. Personal & Account Information</b></legend>
            <br>

            <table border="0" cellpadding="8" align="center" width="90%">
                <tr>
                    <td><label for="fullname">Full Name:</label></td>
                    <td>
                        <input type="text" id="fullname" name="fullname"
                        placeholder="Enter full name" required>
                    </td>

                    <td><label for="email">Email Address:</label></td>
                    <td>
                        <input type="email" id="email" name="email"
                        placeholder="example@domain.com" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="phone">Phone Number:</label></td>
                    <td>
                        <input type="tel" id="phone" name="phone"
                        placeholder="017XXXXXXXX" required>
                    </td>

                    <td><label for="password">Password:</label></td>
                    <td>
                        <input type="password" id="password" name="password"
                        placeholder="Create password" minlength="8" required>
                    </td>
                </tr>
            </table>
        </fieldset>

        <br>

        <fieldset>
            <legend><b>2. Shelter Facility & Logistics Details</b></legend>
            <br>

            <table border="0" cellpadding="8" align="center" width="90%">
                <tr>
                    <td><label for="shelter_name">Shelter Name:</label></td>
                    <td>
                        <input type="text" id="shelter_name" name="shelter_name"
                        placeholder="e.g. Central Community Shelter" required>
                    </td>

                    <td><label for="capacity">Shelter Capacity:</label></td>
                    <td>
                        <input type="number" id="capacity" name="capacity"
                        min="10" max="10000" placeholder="e.g. 500" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="shelter_address">Shelter Location / Address:</label></td>
                    <td colspan="3">
                        <input type="text" id="shelter_address" name="shelter_address"
                        placeholder="Enter full street/area details" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="shelter_type">Shelter Type:</label></td>
                    <td>
                        <select id="shelter_type" name="shelter_type" required>
                            <option value="" disabled selected>-- Select Shelter Type --</option>
                            <option value="school">School / College Building</option>
                            <option value="community">Community Center</option>
                            <option value="cyclone">Cyclone / Flood Shelter</option>
                            <option value="camp">Temporary Relief Camp</option>
                        </select>
                    </td>

                    <td><label for="gov_id">NID / Government ID Upload:</label></td>
                    <td>
                        <input type="file" id="gov_id" name="gov_id">
                    </td>
                </tr>
            </table>
        </fieldset>

        <br>

        <fieldset>
            <legend><b>3. Account Registration</b></legend>
            <br>

            <table border="0" cellpadding="8" align="center" width="90%">
                <tr>
                    <td colspan="4" align="center">
                        <button type="submit">Register Shelter</button>
                        <button type="reset">Clear All Fields</button>
                    </td>
                </tr>
            </table>
            <br>
        </fieldset>

    </form>

    <br>

    <table border="0" width="100%" cellpadding="5">
        <tr>
            <td align="center">
                <hr>
                <small>© 2026 ReliefGrid Disaster Management System | Shelter Module</small>
            </td>
        </tr>
    </table>

</body>
</html>
