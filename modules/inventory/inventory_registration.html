<!DOCTYPE html>
<html>
<head>
    <title>Inventory Registration - ReliefGrid</title>
</head>
<body>

    <!-- Header Section -->
    <table border="1" width="100%" cellpadding="10">
        <tr>
            <td align="center">
                <h2>ReliefGrid: Inventory Management System</h2>
                <h3>Stock / Donation Registration Form</h3>
            </td>
        </tr>
    </table>

    <br>

    <!-- Navigation / Back Links -->
    <table border="1" width="100%" cellpadding="5">
        <tr>
            <td align="center">
                <a href="../../index.html"><button type="button">Go to Home Page</button></a> | 
                <a href="../../login.html"><button type="button">Go to Login Page</button></a>
            </td>
        </tr>
    </table>

    <br>

    <!-- Registration Form Section -->
    <form action="../../login.html" method="POST">
        <fieldset>
            <legend><b>Inventory Stock / Relief Item Details</b></legend>
            <table border="0" cellpadding="8">
                <tr>
                    <td><label for="item_name">Item Name:</label></td>
                    <td><input type="text" id="item_name" name="item_name" placeholder="e.g. Rice, Water, Blankets" required></td>
                    
                    <td><label for="category">Category:</label></td>
                    <td>
                        <select id="category" name="category">
                            <option value="">--Select Category--</option>
                            <option value="dry_food">Dry Food</option>
                            <option value="water">Pure Drinking Water</option>
                            <option value="medical">Medical Supplies</option>
                            <option value="clothing">Clothing & Shelter</option>
                            <option value="sanitation">Sanitation Items</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label for="quantity">Quantity Amount:</label></td>
                    <td><input type="number" id="quantity" name="quantity" min="1" required></td>
                    
                    <td><label for="unit">Unit Type:</label></td>
                    <td>
                        <select id="unit" name="unit">
                            <option value="kg">Kilograms (KG)</option>
                            <option value="liters">Liters</option>
                            <option value="boxes">Boxes / Cartons</option>
                            <option value="packs">Packs / Packets</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label for="supplier">Donor / Provider Name:</label></td>
                    <td><input type="text" id="supplier" name="supplier" placeholder="Organization / Individual"></td>
                    
                    <td><label for="warehouse">Storage Location / Warehouse:</label></td>
                    <td><input type="text" id="warehouse" name="warehouse" placeholder="e.g. Warehouse 1, Sylhet"></td>
                </tr>
                <tr>
                    <td><label for="entry_date">Entry Date:</label></td>
                    <td><input type="date" id="entry_date" name="entry_date"></td>
                    
                    <td><label for="expiry_date">Expiry Date (If applicable):</label></td>
                    <td><input type="date" id="expiry_date" name="expiry_date"></td>
                </tr>
                <tr>
                    <td>Item Condition:</td>
                    <td colspan="3">
                        <input type="radio" id="usable" name="condition" value="Usable" checked>
                        <label for="usable">Ready for Distribution</label>
                        
                        <input type="radio" id="perishable" name="condition" value="Perishable">
                        <label for="perishable">Perishable Good</label>
                    </td>
                </tr>
                <tr>
                    <td><label for="remarks">Additional Notes:</label></td>
                    <td colspan="3">
                        <textarea id="remarks" name="remarks" rows="3" cols="50" placeholder="Enter extra details or instructions..."></textarea>
                    </td>
                </tr>
            </table>
        </fieldset>

        <br>

        <!-- Form Buttons -->
        <div>
            <button type="submit">Register Inventory Stock</button>
            <button type="reset">Clear Form</button>
        </div>
    </form>

    <br>

    <!-- Footer -->
    <hr>
    <p align="center"><small>&copy; 2026 ReliefGrid Inventory Module</small></p>

</body>
</html>
